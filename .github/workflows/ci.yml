name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src/fleet --ignore-missing-imports

      - name: Test
        run: uv run pytest -q

  wheel-contains-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel
        run: uv build --wheel

      - name: Check wheel contains static assets
        run: |
          pip install wheel
          python - <<'EOF'
          import zipfile, sys, glob
          wheels = glob.glob("dist/*.whl")
          assert wheels, "No wheel found"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          ui_files = [n for n in names if n.startswith("fleet/static/")]
          if not ui_files:
              print("ERROR: wheel contains no fleet/static/ files", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(ui_files)} static asset(s) in wheel")
          EOF
