[project]
name = "bottensor-fleet"
version = "0.1.0"
description = "Graph-native multi-agent fleet for Python. BYO-key. Local-first."
authors = [{ name = "Rama Krishna Bachu", email = "ram@bottensor.xyz" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "llm", "multi-agent", "orchestration", "dag", "anthropic", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "polyrt>=0.1.0",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "redis[hiredis]>=5.0",
  "duckduckgo-search>=6.0",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
fleet = "fleet.cli:app"

[project.urls]
Homepage = "https://bottensor.xyz"
Repository = "https://github.com/ramankrishna/bottensor-fleet"
Issues = "https://github.com/ramankrishna/bottensor-fleet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.wheel.shared-data]
"ui/dist" = "fleet/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
